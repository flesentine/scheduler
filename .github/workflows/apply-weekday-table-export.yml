name: Apply weekday table export

on:
  push:
    branches:
      - add-weekday-table-export
    paths:
      - '.github/workflows/apply-weekday-table-export.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add weekday to table export dates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = "    return `${pad(date.getMonth()+1)}/${pad(date.getDate())}/${date.getFullYear()}`;"
          new = "    const weekday = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][date.getDay()];\n    return `${weekday} ${pad(date.getMonth()+1)}/${pad(date.getDate())}/${date.getFullYear()}`;"

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one exportDate return line, found {text.count(old)}')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-weekday-table-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git add -u -- .github/workflows/apply-weekday-table-export.yml
          git diff --cached --check
          git commit -m 'Add weekdays to table export dates'
          git push origin HEAD:add-weekday-table-export
