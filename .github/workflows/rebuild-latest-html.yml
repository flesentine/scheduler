name: Publish latest attached scheduler

on:
  push:
    branches:
      - import-latest-html
    paths:
      - '.github/workflows/rebuild-latest-html.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: import-latest-html
          fetch-depth: 0

      - name: Rebuild and verify attached HTML
        shell: bash
        run: |
          cat .payload-00 .payload-01 .payload-02 .payload-03 .payload-04 | base64 --decode | gunzip > index.html
          echo '4c090d1f18e24bfded6dcd21ace7d26bae2875b2dbb205b966aee10ae03fd381  index.html' | sha256sum --check --strict
          rm -f .payload-00 .payload-01 .payload-02 .payload-03 .payload-04
          rm -rf .github
          printf '%s\n' \
            '# Software Effort Calendar' \
            '' \
            'Single-file scheduling calendar. The app lives in `index.html` and runs directly in a browser.' \
            '' \
            '## Run' \
            '' \
            'Open `index.html` locally or host this repository with GitHub Pages.' \
            '' \
            'The current build supports saved calendars, task editing, JSON backup/restore, CSV import, and Excel `.xlsx` import/export.' \
            > README.md

      - name: Commit clean scheduler tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- :/
          git add -- index.html README.md
          git diff --cached --check
          git commit -m 'Publish latest Software Effort Calendar'
          git push origin HEAD:import-latest-html
